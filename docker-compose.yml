version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mortgage-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - DATABASE_PATH=/app/backend/mortgage.db
      - JWT_SECRET=${JWT_SECRET:-mortgage-ai-production-secret-key-2026}
      - DB_USE_SQLITE=true
    volumes:
      - backend-data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: mortgage-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: mortgage-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

volumes:
  backend-data:
