version: '3.8'

services:
  # Backend API with full production stack
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mortgage-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mortgage
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://frontend
      - SECRET_KEY=${SECRET_KEY:-change-in-production-use-env-file}
      - DB_POOL_MIN_SIZE=2
      - DB_POOL_MAX_SIZE=10
      # OCR & Document Processing
      - UPLOAD_DIR=/app/uploads
      - TESSERACT_DATA_DIR=/usr/share/tessdata
      # Fairness Audit
      - FAIRNESS_REPORTS_DIR=/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mlflow:
        condition: service_started
    networks:
      - mortgage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads

  # Frontend React App
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: mortgage-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mortgage-network
    restart: unless-stopped

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: mortgage-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mortgage-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: mortgage-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mortgage
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - mortgage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MLflow tracking server
  mlflow:
    image: python:3.11-slim
    container_name: mortgage-mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://postgres:postgres@db:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"
    networks:
      - mortgage-network
    restart: unless-stopped
    depends_on:
      - db
    command: >
      bash -c "pip install mlflow==2.8.0 psycopg2-binary==2.9.9 &&
      mlflow server --backend-store-uri $${MLFLOW_BACKEND_STORE_URI}
      --default-artifact-root $${MLFLOW_DEFAULT_ARTIFACT_ROOT}
      --host 0.0.0.0 --port 5000"

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: mortgage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mortgage-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.2.3
    container_name: mortgage-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - mortgage-network
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  mortgage-data:
    driver: local
  redis-data:
  postgres-data:
  mlflow-data:
  prometheus-data:
  grafana-data:

networks:
  mortgage-network:
    driver: bridge
