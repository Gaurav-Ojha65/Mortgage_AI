[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
norecursedirs = .git .vscode node_modules __pycache__ .pytest_cache reports blobs graphify-out scratch data ml/data
filterwarnings =
    ignore::UserWarning:shap.*
    ignore::DeprecationWarning

